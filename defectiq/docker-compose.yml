services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: defectiq
      POSTGRES_PASSWORD: defectiq
      POSTGRES_DB: defectiq
    ports: ["5432:5432"]
    volumes: ["./pgdata:/var/lib/postgresql/data"]

  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["./qdrant_storage:/qdrant/storage"]

